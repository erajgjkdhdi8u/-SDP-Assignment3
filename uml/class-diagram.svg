<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920"><rect width="1500" height="920" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222}.edge{fill:none;stroke:#333;stroke-width:2}.impl{stroke-dasharray:8 6}</style><defs><marker id="inherit" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 12 7 L 0 0 L 0 14 Z" fill="white" stroke="#333" stroke-width="1.3"/></marker></defs><text x="55" y="50" font-size="28" font-weight="bold">Multi-Channel Notification Gateway</text><text x="55" y="80" font-size="20">UML Class Diagram — Bridge Pattern</text><rect x="390" y="155" width="340" height="160" fill="white" stroke="#333" stroke-width="2"/><line x1="390" y1="197" x2="730" y2="197" stroke="#333"/><text x="560" y="180" font-weight="bold" font-size="19" text-anchor="middle">Notification</text><text x="560" y="215" text-anchor="middle" font-size="14" font-style="italic">abstract class</text><text x="402" y="231" font-size="15"># sender: MessageSender</text><text x="402" y="256" font-size="15">+ setSender(sender): void</text><text x="402" y="281" font-size="15">+ send(recipient, message): void</text><rect x="850" y="155" width="375" height="160" fill="white" stroke="#333" stroke-width="2"/><line x1="850" y1="197" x2="1225" y2="197" stroke="#333"/><text x="1037.5" y="180" font-weight="bold" font-size="19" text-anchor="middle">MessageSender</text><text x="1037.5" y="215" text-anchor="middle" font-size="14" font-style="italic">interface</text><text x="862" y="231" font-size="15">+ sendMessage(recipient, title, body)</text><text x="862" y="256" font-size="15">+ isAvailable(): boolean</text><text x="862" y="281" font-size="15">+ getChannelName(): String</text><path class="edge" d="M 333 409 H 360 V 235 H 390" marker-end="url(#inherit)"/><rect x="65" y="365" width="268" height="88" fill="white" stroke="#333" stroke-width="2"/><line x1="65" y1="407" x2="333" y2="407" stroke="#333"/><text x="199" y="3